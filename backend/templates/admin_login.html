<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin sign in | CrimeTrack</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="auth-page">
  <main class="auth-panel">
    <span class="brand-mark brand-mark-large" aria-label="CrimeTrack radar logo" role="img"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 12 18 6M12 4v2M4 12h2M12 18v2M18 12h2"></path><circle cx="12" cy="12" r="1.5"></circle></svg></span>
    <label class="theme-control auth-theme">Theme<select id="theme-preference" aria-label="Theme preference"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    <p class="eyebrow">CrimeTrack · Lagos Metro</p>
    <h1>Admin sign in</h1>
    <p class="muted">Review reports, assign risk, and keep incident data reliable.</p>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <form method="post" class="stack-form">
      <label>Username<input name="username" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="button button-primary" type="submit">Sign in</button>
    </form>
    <p class="fine-print">Authorized CrimeTrack operators only.</p>
  </main>
</body>
<script>
  const themePreference = document.querySelector('#theme-preference');
  const savedTheme = localStorage.getItem('crimetrack.admin.theme') || 'system';
  themePreference.value = savedTheme;
  document.documentElement.dataset.theme = savedTheme;
  themePreference.addEventListener('change', () => {
    localStorage.setItem('crimetrack.admin.theme', themePreference.value);
    document.documentElement.dataset.theme = themePreference.value;
  });
</script>
</html>
